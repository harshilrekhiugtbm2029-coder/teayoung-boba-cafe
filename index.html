<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeaYoung Boba Café</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbf8f1}
#ty-app{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="ty-app" src="/" title="TeaYoung Boba Café"></iframe>
<script>
(function(){
  var frame=document.getElementById('ty-app');
  frame.addEventListener('load',function(){
    try{
      var doc=frame.contentDocument;
      if(!doc) return;
      var style=doc.createElement('style');
      style.textContent=''+
        '@keyframes tySeamlessMarquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(-12.5%,0,0)}}'+
        '.ty-seamless-viewport{overflow:hidden!important;width:100%!important;position:relative!important}'+
        '.ty-seamless-track{display:flex!important;flex-wrap:nowrap!important;width:max-content!important;min-width:max-content!important;justify-content:flex-start!important;align-items:center!important;gap:0!important;animation:tySeamlessMarquee 30s linear infinite!important;will-change:transform!important}'+
        '.ty-seamless-copy{display:flex!important;flex:0 0 auto!important;flex-wrap:nowrap!important;width:max-content!important;min-width:max-content!important;justify-content:flex-start!important;align-items:center!important;gap:0!important}'+
        '.ty-seamless-copy>*{flex:0 0 auto!important}';
      if(doc.head) doc.head.appendChild(style);

      var done=false;
      function fixTicker(){
        if(done) return;
        var nodes=[].slice.call(doc.querySelectorAll('*'));
        var candidates=nodes.filter(function(el){
          var t=(el.textContent||'').replace(/\s+/g,' ').trim();
          return t.indexOf('HAND-SHAKEN')!==-1 && t.indexOf('GOOD ENERGY ONLY')!==-1 && el.children.length>=2 && t.length<2500;
        });
        candidates.sort(function(a,b){return a.textContent.length-b.textContent.length;});
        var ticker=candidates[0];
        if(!ticker) return;
        done=true;
        var viewport=ticker.parentElement||ticker;
        viewport.classList.add('ty-seamless-viewport');
        var original=ticker.innerHTML;
        var track=doc.createElement('div');
        track.className='ty-seamless-track';
        for(var i=0;i<8;i++){
          var copy=doc.createElement('div');
          copy.className='ty-seamless-copy';
          copy.innerHTML=original;
          track.appendChild(copy);
        }
        ticker.innerHTML='';
        ticker.appendChild(track);
        ticker.style.display='block';
        ticker.style.width='max-content';
        ticker.style.minWidth='max-content';
        ticker.style.margin='0';
        ticker.style.padding='0';
        ticker.style.overflow='visible';
      }
      var attempts=0;
      var timer=setInterval(function(){
        fixTicker();
        attempts++;
        if(attempts>40) clearInterval(timer);
      },250);
      fixTicker();
    }catch(e){
      console.error('TeaYoung ticker enhancement skipped',e);
    }
  });
})();
</script>
</body>
</html>
