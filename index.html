<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeaYoung Boba Café</title>
<style>html,body{margin:0;min-height:100%;background:#fbf8f1}</style>
</head>
<body>
<script>
(async()=>{
  const originalPath = location.pathname + location.search + location.hash;
  const projectPath = location.pathname.replace(/\/+$/,'') || '/';
  const appUrl = projectPath === '/' ? './app.html' : projectPath + '/app.html';
  try {
    // Fetch the real app while we are still on the GitHub Pages project path.
    const res = await fetch(appUrl,{cache:'no-store'});
    if(!res.ok) throw new Error('Unable to load app shell: '+res.status);
    let html = await res.text();
    // The existing compiled app expects the domain root. Let it boot at /,
    // then restore the GitHub Pages URL without firing a popstate event.
    history.replaceState(null,'','/');
    const injected = `\n<style id="ty-pages-fixes">\n  @keyframes tyTickerLoop { from { transform: translate3d(0,0,0); } to { transform: translate3d(-25%,0,0); } }\n  .ty-infinite-ticker { animation: tyTickerLoop 28s linear infinite !important; will-change: transform; }\n  .ty-infinite-ticker > * { flex: 0 0 auto !important; }\n</style>\n<script>\n(() => {\n  const targetPath = ${JSON.stringify(originalPath || projectPath + '/')};\n  function fixTicker(){\n    const all = [...document.querySelectorAll('*')];\n    const candidates = all.filter(el => {\n      const text = (el.textContent || '').replace(/\\s+/g,' ').trim();\n      return text.includes('HAND-SHAKEN') && text.includes('GOOD ENERGY ONLY') && el.children.length >= 2 && text.length < 2500;\n    });\n    const ticker = candidates.sort((a,b) => a.textContent.length - b.textContent.length)[0];\n    if(!ticker || ticker.dataset.tyInfiniteFixed) return;\n    const viewport = ticker.parentElement || ticker;\n    viewport.style.overflow = 'hidden';\n    viewport.style.width = '100%';\n    ticker.dataset.tyInfiniteFixed = '1';\n    const original = ticker.innerHTML;\n    ticker.innerHTML = original + original + original + original;\n    ticker.classList.add('ty-infinite-ticker');\n    ticker.style.display = 'flex';\n    ticker.style.flexWrap = 'nowrap';\n    ticker.style.width = 'max-content';\n    ticker.style.minWidth = 'max-content';\n    ticker.style.justifyContent = 'flex-start';\n    ticker.style.alignItems = 'center';\n    ticker.style.gap = '0';\n  }\n  const run = () => { fixTicker(); };\n  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',run,{once:true}); else run();\n  new MutationObserver(run).observe(document.documentElement,{subtree:true,childList:true});\n  setInterval(run,1000);\n  setTimeout(() => history.replaceState(null,'',targetPath),1200);\n})();\n<\\/script>\n`;
    if(html.includes('</body>')) html = html.replace('</body>', injected + '</body>');
    else html += injected;
    document.open();
    document.write(html);
    document.close();
  } catch(err) {
    document.body.innerHTML = '<div style="font-family:system-ui;padding:40px">Unable to load TeaYoung right now.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
